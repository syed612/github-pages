<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syed612 Play Store</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="#">Syed612 Play Store</a>
        <input type="text" class="search-bar" placeholder="Search for apps & games">
    </nav>

    <!-- Sidebar Menu -->
    <div class="sidebar">
        <h4>Categories</h4>
        <ul>
            <li><a href="#">Top Charts</a></li>
            <li><a href="#">Games</a></li>
            <li><a href="#">Apps</a></li>
            <li><a href="#">Kids</a></li>
        </ul>
    </div>

    <!-- App Grid -->
    <div class="content">
        <h2>Popular Apps</h2>
        <div class="app-grid">
            <div class="app-card" onclick="openAppModal('App 1', 'This is a sample app description.')">
                <img src="https://via.placeholder.com/100" alt="App 1">
                <p>App 1</p>
            </div>
            <div class="app-card" onclick="openAppModal('App 2', 'This is another app description.')">
                <img src="https://via.placeholder.com/100" alt="App 2">
                <p>App 2</p>
            </div>
        </div>
    </div>

    <!-- App Details Popup -->
    <div id="appModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAppModal()">&times;</span>
            <h2 id="appTitle">App Title</h2>
            <p id="appDescription">App Description</p>
        </div>
    </div>

</body>
</html>
